<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">F.R.I.D.A.Y. command-core logo</title>
  <desc id="desc">A cyan geometric letter F inside a dark hexagonal command core with orbital signal arcs.</desc>
  <defs>
    <linearGradient id="shell" x1="72" y1="44" x2="440" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172733"/>
      <stop offset="0.52" stop-color="#071017"/>
      <stop offset="1" stop-color="#020609"/>
    </linearGradient>
    <linearGradient id="cyan" x1="158" y1="130" x2="357" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFFBFF"/>
      <stop offset="0.32" stop-color="#4DD6FF"/>
      <stop offset="1" stop-color="#087CA8"/>
    </linearGradient>
    <linearGradient id="signal" x1="164" y1="112" x2="356" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3D99C"/>
      <stop offset="1" stop-color="#A8772A"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="43%" r="60%">
      <stop stop-color="#163B4D"/>
      <stop offset="0.48" stop-color="#07141C"/>
      <stop offset="1" stop-color="#020609"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#4DD6FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="112" fill="#03080C"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)"/>
  <circle cx="256" cy="256" r="166" fill="#087CA8" opacity="0.18" filter="url(#soft)"/>

  <path d="M256 44 430 144v224L256 468 82 368V144Z" fill="url(#shell)" stroke="#26404E" stroke-width="4"/>
  <path d="M256 67 410 156v200L256 445 102 356V156Z" fill="url(#core)" stroke="#4DD6FF" stroke-opacity="0.42" stroke-width="2"/>
  <path d="M256 84 395 164v184L256 428 117 348V164Z" fill="none" stroke="#D8B36A" stroke-opacity="0.4"/>

  <g fill="none" stroke-linecap="round">
    <path d="M107 209c29-72 92-119 165-125" stroke="#4DD6FF" stroke-opacity="0.22" stroke-width="7"/>
    <path d="M405 303c-23 68-80 117-149 125" stroke="#4DD6FF" stroke-opacity="0.22" stroke-width="7"/>
    <path d="M91 282c10 48 38 91 78 119" stroke="#D8B36A" stroke-width="5"/>
    <path d="M421 230c-9-47-37-90-76-118" stroke="#D8B36A" stroke-width="5"/>
  </g>

  <circle cx="91" cy="282" r="8" fill="#D8B36A" filter="url(#glow)"/>
  <circle cx="421" cy="230" r="8" fill="#D8B36A" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#4DD6FF" stroke-opacity="0.16" stroke-width="16"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#4DD6FF" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="2 16"/>

  <path d="M184 145h164v47H237v47h91v45h-91v91h-53Z" fill="#4DD6FF" opacity="0.24" filter="url(#glow)"/>
  <path d="M184 145h164v47H237v47h91v45h-91v91h-53Z" fill="url(#cyan)"/>
  <path d="M237 192h111v10H247v37h-10Z" fill="#FFFFFF" opacity="0.45"/>
  <path d="M184 375h53v-15h-38V160h149v-15H184Z" fill="url(#signal)" opacity="0.82"/>

  <g fill="#4DD6FF">
    <circle cx="256" cy="67" r="4"/>
    <circle cx="410" cy="356" r="4"/>
    <circle cx="102" cy="356" r="4"/>
  </g>
</svg>
