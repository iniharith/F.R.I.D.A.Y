<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1440" role="img" aria-labelledby="title desc">
  <title id="title">F.R.I.D.A.Y. Android mobile command link</title>
  <desc id="desc">A representative rendering of the Android chat screen based on the project's Jetpack Compose interface.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="720" y2="1440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071017"/>
      <stop offset="1" stop-color="#03080C"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BE7FF"/>
      <stop offset="1" stop-color="#1B9BC5"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#4DD6FF" stroke-opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="phone"><rect x="20" y="20" width="680" height="1400" rx="62"/></clipPath>
  </defs>

  <rect width="720" height="1440" rx="76" fill="#010305"/>
  <rect x="10" y="10" width="700" height="1420" rx="68" fill="#111B22" stroke="#2C4655" stroke-width="3"/>
  <g clip-path="url(#phone)">
    <rect x="20" y="20" width="680" height="1400" fill="url(#screen)"/>
    <rect x="20" y="20" width="680" height="1400" fill="url(#grid)"/>

    <rect x="20" y="20" width="680" height="48" fill="#040A0E"/>
    <text x="56" y="51" fill="#9BB0BF" font-family="Consolas, monospace" font-size="16">09:41</text>
    <g fill="none" stroke="#9BB0BF" stroke-width="3">
      <path d="M603 46h5v-8h5v8h5V34h5v12h5V29h5v17"/>
      <path d="M648 37c9-8 19-8 28 0M654 43c5-4 11-4 16 0" stroke-linecap="round"/>
    </g>
    <rect x="677" y="32" width="8" height="17" rx="2" fill="#9BB0BF"/>

    <rect x="20" y="68" width="680" height="112" fill="#050B10" stroke="#4DD6FF" stroke-opacity="0.16"/>
    <image href="friday-logo.png" x="46" y="85" width="76" height="76" preserveAspectRatio="xMidYMid meet"/>
    <circle cx="141" cy="123" r="8" fill="#00CC66" filter="url(#glow)"/>
    <text x="164" y="119" fill="#E8F6FF" font-family="Consolas, monospace" font-size="24" font-weight="700" letter-spacing="4">F.R.I.D.A.Y.</text>
    <text x="164" y="146" fill="#687C8B" font-family="Consolas, monospace" font-size="13" letter-spacing="2">MOBILE COMMAND LINK</text>
    <text x="548" y="116" fill="#687C8B" font-family="Consolas, monospace" font-size="13">LISTENING</text>
    <g transform="translate(650 128)" fill="none" stroke="#687C8B" stroke-width="3">
      <circle r="15"/><circle r="5"/><path d="M-13-8l-7-4M13-8l7-4M-13 8l-7 4M13 8l7 4"/>
    </g>

    <g font-family="Consolas, monospace">
      <g transform="translate(42 204)">
        <path d="M0 10 10 0h137v82H0Z" fill="#0C151C" stroke="#27404E"/>
        <text x="16" y="29" fill="#687C8B" font-size="12" letter-spacing="1">LAPTOP MIC</text>
        <text x="16" y="57" fill="#4DD6FF" font-size="17" font-weight="700">ACTIVE</text>
      </g>
      <g transform="translate(203 204)">
        <path d="M0 10 10 0h137v82H0Z" fill="#0C151C" stroke="#27404E"/>
        <text x="16" y="29" fill="#687C8B" font-size="12" letter-spacing="1">MEMORY</text>
        <text x="16" y="57" fill="#4DD6FF" font-size="17" font-weight="700">24 FACTS</text>
      </g>
      <g transform="translate(364 204)">
        <path d="M0 10 10 0h137v82H0Z" fill="#0C151C" stroke="#27404E"/>
        <text x="16" y="29" fill="#687C8B" font-size="12" letter-spacing="1">GUARDIAN</text>
        <text x="16" y="57" fill="#00CC66" font-size="17" font-weight="700">NOMINAL</text>
      </g>
      <g transform="translate(525 204)">
        <path d="M0 10 10 0h137v82H0Z" fill="#0C151C" stroke="#27404E"/>
        <text x="16" y="29" fill="#687C8B" font-size="12" letter-spacing="1">VISION</text>
        <text x="16" y="57" fill="#687C8B" font-size="17" font-weight="700">READY</text>
      </g>
    </g>

    <text x="44" y="334" fill="#D8B36A" font-family="Consolas, monospace" font-size="13" letter-spacing="3">SECURE ASSISTANT CHANNEL // LOCAL</text>
    <path d="M44 351H676" stroke="#D8B36A" stroke-opacity="0.38"/>

    <g font-family="Segoe UI, sans-serif">
      <path d="M176 390h459l17 17v116H193l-17-17Z" fill="#123140" stroke="#4DD6FF" stroke-opacity="0.45"/>
      <text x="212" y="432" fill="#E8F6FF" font-size="21">Check my project status and summarize</text>
      <text x="212" y="464" fill="#E8F6FF" font-size="21">what is ready for release.</text>
      <text x="578" y="506" fill="#687C8B" font-family="Consolas, monospace" font-size="13">09:40</text>

      <path d="M44 562h504l17 17v203H61l-17-17Z" fill="#0D171E" stroke="#294451"/>
      <text x="70" y="606" fill="#4DD6FF" font-family="Consolas, monospace" font-size="13" letter-spacing="2">F.R.I.D.A.Y.</text>
      <text x="70" y="650" fill="#E8F6FF" font-size="20">The core systems are ready:</text>
      <circle cx="77" cy="692" r="4" fill="#00CC66"/><text x="94" y="699" fill="#C9DCE7" font-size="19">Local voice, vision, and memory</text>
      <circle cx="77" cy="734" r="4" fill="#00CC66"/><text x="94" y="741" fill="#C9DCE7" font-size="19">HUD and Android command link</text>
      <text x="481" y="766" fill="#687C8B" font-family="Consolas, monospace" font-size="13">09:40</text>
    </g>

    <g transform="translate(44 826)">
      <path d="M0 14 14 0h604v178H0Z" fill="#0B151C" stroke="#D8B36A" stroke-opacity="0.55"/>
      <text x="24" y="39" fill="#D8B36A" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">CONFIRM ACTION</text>
      <text x="24" y="76" fill="#E8F6FF" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600">Run release checks</text>
      <text x="24" y="105" fill="#9BB0BF" font-family="Segoe UI, sans-serif" font-size="16">Execute the test suite in the project workspace.</text>
      <rect x="24" y="126" width="257" height="38" rx="4" fill="none" stroke="#FF3D55"/>
      <text x="123" y="151" fill="#FF667A" font-family="Consolas, monospace" font-size="14" font-weight="700">DENY</text>
      <rect x="299" y="126" width="281" height="38" rx="4" fill="#4DD6FF"/>
      <text x="393" y="151" fill="#041017" font-family="Consolas, monospace" font-size="14" font-weight="700">APPROVE</text>
    </g>

    <g transform="translate(20 1084)">
      <rect width="680" height="336" fill="#081118" stroke="#4DD6FF" stroke-opacity="0.15"/>
      <circle cx="66" cy="85" r="28" fill="#111F28" stroke="#687C8B"/>
      <path d="M66 69v24M57 86c0 12 18 12 18 0M66 98v8M57 106h18" fill="none" stroke="#9BB0BF" stroke-width="3" stroke-linecap="round"/>
      <path d="M112 57h438l14 14v63H126l-14-14Z" fill="#060D12" stroke="#294451"/>
      <text x="140" y="101" fill="#687C8B" font-family="Segoe UI, sans-serif" font-size="19">Type to F.R.I.D.A.Y.</text>
      <path d="M587 56h68l13 13v65h-81Z" fill="url(#cyan)"/>
      <path d="M611 82 646 96l-35 14 8-14Z" fill="#041017"/>

      <g transform="translate(44 190)" font-family="Consolas, monospace">
        <circle cx="8" cy="8" r="8" fill="#00CC66" filter="url(#glow)"/>
        <text x="30" y="14" fill="#9BB0BF" font-size="15" letter-spacing="2">CONNECTED // 192.168.1.42:8000</text>
        <path d="M0 43H592" stroke="#4DD6FF" stroke-opacity="0.22"/>
        <text x="0" y="78" fill="#4DD6FF" font-size="13" letter-spacing="2">PHONE MIC READY</text>
        <text x="459" y="78" fill="#687C8B" font-size="13">ENCRYPTED LINK</text>
      </g>
    </g>
  </g>

  <rect x="276" y="33" width="168" height="12" rx="6" fill="#000"/>
  <rect x="250" y="1399" width="220" height="7" rx="4" fill="#9BB0BF" opacity="0.55"/>
</svg>
